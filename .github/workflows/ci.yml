name: Cafe Project CI-CD (TC2.4-2.6)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      production_tag:
        description: 'Optional production version (v1.2.3); publish only after Full and all quality gates'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '0 19 * * 0'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: cafe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  # Valid URL for Prisma generation/validation, deliberately unreachable.
  DATABASE_URL: postgresql://ci_no_write:ci_no_write@127.0.0.1:1/ci_unreachable
  AGENT_GRAPH_READONLY: 'YES'

jobs:
  # Rubric stage 1: BUILD. Never migrate or seed a database in CI.
  build:
    name: '01 / Build + typecheck'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate Prisma schema and generate local client
        run: |
          npx prisma validate --schema packages/database/prisma/schema
          npm run generate -w @cafe-project/database
      - name: TypeScript checks
        run: npm run check-types
      - name: Production build
        run: npm run build

  # Rubric stage 2: lint/static analysis. Do not hide existing lint debt.
  lint:
    name: '02 / Lint'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: ESLint (no auto-fix or suppression)
        run: npm run lint

  # Release assets stay in this repository; missing/mismatched bundles fail closed.
  test:
    name: '03 / Selected regression'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tier: ${{ steps.regression.outputs.tier }}
      bundle_sha: ${{ steps.bundle.outputs.sha256 }}
    env:
      # Original artifact-path assertion requires the source/artifacts sibling layout.
      CAFE_PROJECT_TEST_ROOT: ${{ github.workspace }}/../../cafe-project-artifacts/testing
      REGRESSION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Fetch pinned same-repository regression release
        id: bundle
        run: python3 scripts/ci/fetch-regression.py --destination ../../cafe-project-artifacts
      - name: Build dependencies and prepare browser
        run: |
          npm run generate -w @cafe-project/database
          npm run build
          npx playwright install --with-deps chromium
      - name: Reconnect test workspace
        env:
          CAFE_PROJECT_ROOT: ${{ github.workspace }}
        run: bash "$CAFE_PROJECT_TEST_ROOT/bootstrap-links.sh"
      - name: Verify selection and registry guards
        env:
          CAFE_PROJECT_ROOT: ${{ github.workspace }}
        run: node --test "$CAFE_PROJECT_TEST_ROOT"/ci/*.test.cjs
      - name: Select and execute required tier
        id: regression
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tier=smoke
          if [[ "$EVENT" == pull_request ]]; then tier=pr; fi
          if [[ "$REF_NAME" == main && "$EVENT" == push ]]; then tier=core; fi
          if [[ "$EVENT" == schedule || "$EVENT" == release || "$EVENT" == workflow_dispatch ]]; then tier=full; fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          node scripts/ci/run-regression.cjs "$tier" 2>&1 | tee "$RUNNER_TEMP/regression.log"
      - name: Upload test execution log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-log
          path: |
            ${{ runner.temp }}/regression.log
            ${{ env.CAFE_PROJECT_TEST_ROOT }}/reports/tier-runs/*.jsonl
          if-no-files-found: error
          retention-days: 30

  # Rubric stage 4: dependency, secret and configuration scanning.
  security:
    name: '04 / Security scanning'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: npm production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Prepare tracked source scan (exclude installed vendor build recipes)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/security-source"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/security-source"
      - name: Trivy vulnerability, secret and configuration scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: ${{ runner.temp }}/security-source
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  production-release-gate:
    name: 'Production release / Full regression required'
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [build, lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Full on this exact source revision
        env:
          TIER: ${{ needs.test.outputs.tier }}
        run: test "$TIER" = full

  publish-production-release:
    name: 'Production release / Publish verified revision'
    if: github.event_name == 'workflow_dispatch' && inputs.production_tag != ''
    needs: production-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Publish only the revision that passed Full, build, lint and security
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.production_tag }}
          TRUSTED_BRANCH: ${{ vars.CI_DEPLOY_BRANCH || 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" == "$TRUSTED_BRANCH" ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          # Atomic tag creation rejects an existing tag instead of trusting its target.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          gh release create "$RELEASE_TAG" --verify-tag --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Full regression, build, lint and security passed for $GITHUB_SHA in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."

  # Rubric stage 5: Docker. Registry publishing gated on successful CI.
  docker:
    name: '05 / Docker ${{ matrix.app }}'
    needs: [build, lint, test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, agent, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare lower-case image owner
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR on trusted branch only
        if: github.event_name == 'push' && github.ref_name == (vars.CI_DEPLOY_BRANCH || 'main')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build; publish only from trusted branch
        id: image-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: |
            VITE_API_URL=${{ vars.CI_PUBLIC_API_URL }}
          push: ${{ github.event_name == 'push' && github.ref_name == (vars.CI_DEPLOY_BRANCH || 'main') }}
          tags: ghcr.io/${{ steps.image.outputs.owner }}/cafe-${{ matrix.app }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.github.cafe-project.tests.manifest=scripts/ci/regression-release.json
            io.github.cafe-project.tests.sha256=${{ needs.test.outputs.bundle_sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Record published image digest
        if: github.event_name == 'push' && github.ref_name == (vars.CI_DEPLOY_BRANCH || 'main')
        shell: bash
        env:
          IMAGE: ghcr.io/${{ steps.image.outputs.owner }}/cafe-${{ matrix.app }}
          DIGEST: ${{ steps.image-build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::Missing or invalid published image digest."
            exit 2
          }
          printf 'Published image `%s@%s` for source commit `%s`.\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  # Rubric stage 6: disabled until staging env/secrets are configured.
  staging:
    name: '06 / Staging deploy + smoke + rollback'
    needs: docker
    if: >-
      github.event_name == 'push' &&
      github.ref_name == (vars.CI_DEPLOY_BRANCH || 'main') &&
      vars.CI_ENABLE_STAGING == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: cafe-staging
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check staging configuration
        shell: bash
        env:
          PUBLIC_API_URL: ${{ vars.CI_PUBLIC_API_URL }}
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          for key in HOST USER KEY KNOWN_HOSTS; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing staging configuration: $key"
              exit 2
            fi
          done
          if [[ "$PUBLIC_API_URL" != https://* ||
                "$PUBLIC_API_URL" == *localhost* ||
                "$PUBLIC_API_URL" == *.invalid* ]]; then
            echo "::error::CI_PUBLIC_API_URL must be the real HTTPS staging API URL"
            exit 2
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy commit-tagged images
        shell: bash
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_OWNER="${IMAGE_OWNER,,}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            'mkdir -p /opt/cafe/staging'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/compose.staging.yml deploy/deploy-staging.sh \
            "$USER@$HOST:/opt/cafe/staging/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "bash /opt/cafe/staging/deploy-staging.sh '$IMAGE_OWNER' '$IMAGE_TAG'"
      - name: Record measured commit-to-staging latency for rubric
        shell: bash
        run: |
          set -euo pipefail
          commit_epoch="$(git show -s --format=%ct HEAD)"
          deployed_epoch="$(date -u +%s)"
          seconds="$((deployed_epoch - commit_epoch))"
          if [[ "$seconds" -lt 0 ]]; then
            echo "::error::Commit timestamp is newer than deployment clock"
            exit 1
          fi
          {
            echo "### TC2.6 staging deployment evidence"
            echo "- Commit: $GITHUB_SHA"
            echo "- Deployment UTC: $(date -u -d "@$deployed_epoch" +%FT%TZ)"
            echo "- Commit to healthy staging: $seconds seconds"
            echo "- Target: 900 seconds (15 minutes)"
            echo "- Verified: API + Agent + Web health and exact Git SHA images"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$seconds" -gt 900 ]]; then
            echo "::warning::Commit-to-staging exceeded rubric 15-minute target"
          fi
