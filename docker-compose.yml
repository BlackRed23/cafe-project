version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cafe_postgres
    environment:
      POSTGRES_USER: cafedb
      POSTGRES_PASSWORD: cafedb_password
      POSTGRES_DB: cafedb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  agent:
    image: cafe-agent:local
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    container_name: cafe_agent
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=5055
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN}
      - GEMINI_API_KEY=${OPENAI_API_KEY}
      - NODE_ENV=development
    ports:
      - "5055:5055"
    depends_on:
      - postgres
    restart: unless-stopped

  api:
    image: cafe-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cafe_api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=5000
      - AGENT_BASE_URL=${AGENT_BASE_URL}
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=development
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - agent
    restart: unless-stopped

  web:
    image: cafe-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: cafe_web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
